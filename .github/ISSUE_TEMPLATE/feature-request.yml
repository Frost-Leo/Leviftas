# feature-request.yml
#
# Leviftas project issues Feature Request template.
#
# - Author   : FrostLeo <frostleo.dev@gmail.com>
# - Created  : 2025/10/31
# - Modified : 2025/10/31

name: Feature Request
description: |
  Suggest new features or enhancements to improve the Leviftas project.
title: "[Feature]: "
labels:
  - type-feature
body:
  - type: textarea
    id: report-header
    attributes:
      label: "‎"
      description: "For display only, please do not modify"
      value: |
        <img src="https://frost-leo.github.io/Leviftas/assets/images/github/issues/feature-request/header.svg" alt="Feature Request" width="100%">
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Before submitting this feature request, please confirm all items below:**

  - type: checkboxes
    id: before-confirming
    attributes:
      label: Pre-submission Checklist
      options:
        - label: There are no existing issues with the same or similar feature request
          required: true
        - label: I fully understand the project's goals and scope
          required: true
        - label: This feature aligns with the project's vision and roadmap
          required: true
        - label: I have checked the project's documentation for existing solutions
          required: true
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        #

  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > **Proposing a feature to Leviftas?**
        > 
        > Major feature proposals should generally be discussed with the community first.
        > Consider opening a discussion before submitting this issue to gather feedback and support.

  - type: textarea
    id: feature-proposal
    attributes:
      label: Proposal
      description: |
        Explain your proposal, why it should be implemented, and how it would be used.
      placeholder: |
        Explain your proposal, why it should be implemented, and how it would be used.
        Add examples, if applicable. Put any code blocks inside triple backticks.
        
        ```python
        # Add a code block here, if required
        ```
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        #
        
  - type: textarea
    id: related-links
    attributes:
      label: Related Links
      description: |
        Links to previous discussions, related issues, or pull requests about this feature.
      placeholder: |
        - Refs #NNNN
    validations:
      required: false
