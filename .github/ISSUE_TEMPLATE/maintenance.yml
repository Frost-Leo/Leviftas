# maintenance.yml
#
# Leviftas project issues Maintenance template.
#
# - Author   : FrostLeo <frostleo.dev@gmail.com>
# - Created  : 2025/10/31
# - Modified : 2025/10/31

name: Maintenance/Chore
description: |
  Request dependency updates, configuration changes, or code cleanup tasks.
title: "[Maintenance]: "
labels:
  - type-maintenance
  - type-chore
body:
  - type: textarea
    id: report-header
    attributes:
      label: "‎"
      description: "For display only, please do not modify"
      value: |
        <img src="https://frost-leo.github.io/Leviftas/assets/images/github/issues/maintenance/header.svg" alt="Maintenance" width="100%">
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Before submitting this maintenance request, please confirm all items below:**

  - type: checkboxes
    id: before-confirming
    attributes:
      label: Pre-submission Checklist
      options:
        - label: There are no existing issues with the same maintenance request
          required: true
        - label: This is a maintenance task, not a new feature or bug fix
          required: true
        - label: I have checked the current project status
          required: true
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        #

  - type: dropdown
    id: maintenance-type
    attributes:
      label: Maintenance Type
      description: |
        Select the type of maintenance task you're requesting.
      options:
        - Dependency Updates
        - Configuration Changes
        - Code Cleanup/Refactoring
        - CI/CD Improvements
        - Tooling Updates
        - Security Updates
        - Other
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        #

  - type: textarea
    id: maintenance-description
    attributes:
      label: Maintenance Description
      description: |
        Describe the maintenance task and why it's needed.
      placeholder: |
        Please describe the maintenance task:
        
        **What needs to be done:**
        Specific maintenance task or update required.
        
        **Why it's needed:**
        Reason for this maintenance (security, performance, compatibility, etc.).
        
        **Expected benefits:**
        What improvements this maintenance will bring.
        
        **Additional context:**
        Any other relevant information.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        #

  - type: textarea
    id: related-links
    attributes:
      label: Related Links
      description: |
        Links to previous discussions, related issues, or pull requests about this feature.
      placeholder: |
        - Refs #NNNN
    validations:
      required: false