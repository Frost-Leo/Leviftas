# documentation.yml
#
# Leviftas project issues Documentation template.
#
# - Author   : FrostLeo <frostleo.dev@gmail.com>
# - Created  : 2025/10/31
# - Modified : 2025/10/31

name: Documentation
description: |
  Report documentation issues or suggest improvements to project documentation.
title: "[Docs]: "
labels:
  - type-docs
body:
  - type: textarea
    id: report-header
    attributes:
      label: "‎"
      description: "For display only, please do not modify"
      value: |
        <img src="https://frost-leo.github.io/Leviftas/assets/images/github/issues/documentation/header.svg" alt="Documentation" width="100%">
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Before submitting this documentation issue, please confirm all items below:**

  - type: checkboxes
    id: before-confirming
    attributes:
      label: Pre-submission Checklist
      options:
        - label: There are no existing issues with the same documentation problem
          required: true
        - label: I have searched the existing documentation
          required: true
        - label: I have checked the latest version of the documentation
          required: true
    validations:
      required: true

  - type: textarea
    id: documentation-issue
    attributes:
      label: Documentation Issue
      description: |
        Describe the documentation issue and provide location details.
      placeholder: |
        Please provide the following information:
        
        **Documentation Location:**
        - URL: https://example.com/docs/page
        - File path: docs/README.md
        - Section: Installation Guide
        
        **Issue Description:**
        Describe what's wrong, missing, or unclear in the documentation.
        
        **Suggested Improvement (optional):**
        How do you think this should be improved?
        
        **Additional Context:**
        Any other relevant information.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        #

  - type: textarea
    id: related-links
    attributes:
      label: Related Links
      description: |
        Links to previous discussions, related issues, or pull requests about this feature.
      placeholder: |
        - Refs #NNNN
    validations:
      required: false