# pyproject.toml
#
# Project configuration and build system setup for Leviftas SDK.
#
# Documentation
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
#
# - Author   : FrostLeo <frostleo.dev@gmail.com>
# - Created  : 2025/12/5
# - Modified : 2025/12/10

# Build system configuration - declares build backend and dependencies
[build-system]
requires = [
    "setuptools>=80.9.0",
]
build-backend = "setuptools.build_meta"

# Project configuration - defines basic metadata and dependencies
[project]
name = "leviftas"
dynamic = [
    "version",
]
description = "A distributed and modular SDK for centralized data platforms, built on Django REST Framework."
readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-or-later"
license-files = [
    "LICEN[CS]E*",
]
authors = [
    {name = "Frost Leo", email = "frostleo.dev@gmail.com"},
]
maintainers = [
    {name = "Frost Leo", email = "frostleo.dev@gmail.com"},
]
keywords = [
    "leviftas",
    "data platform",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.3",
    "pydantic_settings>=2.12.0",
    "typing_extensions>=4.15.0",
]

# Executable scripts - command-line tools installed with the package
# TODO: Add CLI commands when implemented
# [project.scripts]
# leviftas = "leviftas.cli:main"

# Optional dependencies
[project.optional-dependencies]
dev = [
    "mypy>=1.18.2",
    "types-PyYAML>=6.0.12",
]
test = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
]
all = [
    "leviftas[dev,test]",
]


# Project URLs
[project.urls]
Homepage = "https://frost-leo.github.io/Leviftas/"
Documentation = "https://github.com/Frost-Leo/Leviftas/wiki"
Repository = "https://github.com/Frost-Leo/Leviftas"
Issues = "https://github.com/Frost-Leo/Leviftas/issues"

# Setuptools-specific configuration
[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.setuptools.package-dir]
"" = "src"

# Dynamic metadata
[tool.setuptools.dynamic]
version = {attr = "leviftas.__version__"}


# Testing configuration options
[tool.pytest.ini_options]
testpaths = "tests"
xfail_strict = true
pythonpath = [
    "src",
]
addopts = [
    # Only overwrite the src/leviftas directory and exclude the test files
    "--cov=src/leviftas",
    # Detailed mode, displaying each test node
    "-v",
    # Short backtracking information
    "--tb=short",
    # Strict marking mode
    "--strict-markers",
    # Generate coverage report in HTML format
    "--cov-report=html",
    # Display coverage report in terminal
    "--cov-report=term",
    # Show uncovered line numbers
    "--cov-report=term-missing",
    # Branch coverage
    "--cov-branch",
]
markers = [
    "internal: Internal system class-related tests",
]
# Logging configuration
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
# Log file configuration
log_file = "tests/logs/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d - %(funcName)s() - %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
# Capture settings
log_level = "INFO"
log_auto_indent = true

# Coverage configuration options
[tool.coverage.run]
source = ["src/leviftas"]
branch = true
relative_files = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "typing.assert_never",
    "assert_never",
]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

# Package data configuration
[tool.setuptools.package-data]
leviftas = ["py.typed"]

# Mypy type checking configuration
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["leviftas"]
strict = true
namespace_packages = true
explicit_package_bases = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
strict_equality = true
strict_concatenate = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true
color_output = true
error_summary = true
incremental = true
cache_dir = ".mypy_cache"

[[tool.mypy.overrides]]
module = [
    "pytest.*",
    "pytest_mock.*",
    "pytest_asyncio.*",
]
ignore_missing_imports = true
