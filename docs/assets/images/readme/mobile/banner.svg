banner.svg

Mobile version of Leviftas project banner with responsive dark/light mode support.
Displays the project title with gradient effects and descriptive subtitle.
Automatically adapts to system color scheme preferences.

- Author   : FrostLeo <frostleo.dev@gmail.com>
- Created  : 2025/10/31
- Modified : 2025/10/31
-->

<svg xmlns="http://www.w3.org/2000/svg"
     width="100%"
     height="140"
     viewBox="0 0 400 140"
     preserveAspectRatio="xMidYMid meet">

    <!-- Gradient Definitions -->
    <defs>
        <!-- Light Mode Gradient: Dark blue to light blue -->
        <linearGradient id="project-title-gradient-light"
                        x1="0%" y1="0%"
                        x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#022640"/>
            <stop offset="95%" style="stop-color:#5786AB"/>
        </linearGradient>

        <!-- Dark Mode Gradient: Light teal to dark blue-gray -->
        <linearGradient id="project-title-gradient-dark"
                        x1="0%" y1="0%"
                        x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#E4F6F0"/>
            <stop offset="31%" style="stop-color:#9DCFCA"/>
            <stop offset="68%" style="stop-color:#6B95AC"/>
            <stop offset="100%" style="stop-color:#45657D"/>
        </linearGradient>
    </defs>

    <!-- Responsive Styles for Dark/Light Mode -->
    <style>
        @media (prefers-color-scheme: dark) {
            .project-title { fill: url(#project-title-gradient-dark); }
            .subtitle-primary { fill: #f5f5f7; }
            .subtitle-secondary { fill: #a1a1a6; }
        }
        @media (prefers-color-scheme: light) {
            .project-title { fill: url(#project-title-gradient-light); }
            .subtitle-primary { fill: #1d1d1f; }
            .subtitle-secondary { fill: #86868b; }
        }
    </style>

    <!-- Project Title -->
    <text x="200" y="50"
          class="project-title"
          fill="url(#project-title-gradient-light)"
          font-family="SF Pro Display, SF Pro Icons, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="48"
          font-weight="600"
          letter-spacing="0em"
          text-anchor="middle">
        Leviftas
    </text>

    <!-- Subtitle Line 1 -->
    <text x="200" y="85"
          font-family="SF Pro Display, SF Pro Icons, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="15"
          font-weight="600"
          letter-spacing="0.011em"
          text-anchor="middle">
        <tspan class="subtitle-primary">
            A distributed and modular SDK for centralized
        </tspan>
    </text>

    <!-- Subtitle Line 2 -->
    <text x="200" y="105"
          font-family="SF Pro Display, SF Pro Icons, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="15"
          font-weight="600"
          letter-spacing="0.011em"
          text-anchor="middle">
        <tspan class="subtitle-primary">
            data platforms,
        </tspan>
        <tspan class="subtitle-secondary">
            built on Django REST Framework.
        </tspan>
    </text>
</svg>