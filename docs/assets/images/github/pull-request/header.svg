header.svg

Header file for Pull Request

- Author   : FrostLeo <frostleo.dev@gmail.com>
- Created  : 2025/10/31
- Modified : 2025/10/31
-->

<svg xmlns="http://www.w3.org/2000/svg"
     width="100%"
     viewBox="0 0 1000 140"
     preserveAspectRatio="xMidYMid meet">

    <!-- Gradient Definitions -->
    <defs>
        <!-- Light Mode Gradient: Dark blue to light blue -->
        <linearGradient id="pull-request-title-gradient-light"
                        x1="0%" y1="0%"
                        x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#022640"/>
            <stop offset="95%" style="stop-color:#5786AB"/>
        </linearGradient>

        <!-- Dark Mode Gradient: Light teal to dark blue-gray -->
        <linearGradient id="pull-request-title-gradient-dark"
                        x1="0%" y1="0%"
                        x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#E4F6F0"/>
            <stop offset="31%" style="stop-color:#9DCFCA"/>
            <stop offset="68%" style="stop-color:#6B95AC"/>
            <stop offset="100%" style="stop-color:#45657D"/>
        </linearGradient>
    </defs>

    <!-- Responsive Styles for Dark/Light Mode -->
    <style>
        @media (prefers-color-scheme: dark) {
            .pull-request-title { fill: url(#pull-request-title-gradient-dark); }
        }
        @media (prefers-color-scheme: light) {
            .pull-request-title { fill: url(#pull-request-title-gradient-light); }
        }
    </style>

    <!-- pull-request Title -->
    <text x="20" y="50"
          class="pull-request-title"
          fill="url(#pull-request-title-gradient-light)"
          font-family="SF Pro Display, SF Pro Icons, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="56"
          font-weight="600"
          letter-spacing="0.03em"
          text-anchor="start">
        Pull Request
    </text>
    
</svg>